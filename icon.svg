  <circle cx="38" cy="40" r="5.5" fill="url(#berry)"/>
  <circle cx="32" cy="37" r="5.5" fill="url(#berry)"/>
  <circle cx="32" cy="48" r="5.5" fill="url(#berry)"/>
  <circle cx="25" cy="49" r="4.5" fill="url(#berry)"/>
