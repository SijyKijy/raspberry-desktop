  <circle cx="30" cy="26" r="1.5" fill="rgba(255,255,255,0.35)"/>
  <circle cx="21" cy="29" r="1.5" fill="rgba(255,255,255,0.35)"/>
  <circle cx="39" cy="29" r="1.5" fill="rgba(255,255,255,0.35)"/>
