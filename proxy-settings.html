<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Настройки прокси</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      padding: 24px;
      user-select: none;
    }
    h2 { font-size: 18px; font-weight: 600; margin-bottom: 20px; color: #fff; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; font-weight: 500; }
    .toggle-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .toggle-row label { margin-bottom: 0; font-size: 14px; color: #e0e0e0; cursor: pointer; }
    .toggle { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background: #333; border-radius: 12px; transition: 0.2s;
    }
    .toggle-slider::before {
      content: ''; position: absolute; width: 18px; height: 18px; left: 3px; bottom: 3px;
      background: #888; border-radius: 50%; transition: 0.2s;
    }
    .toggle input:checked + .toggle-slider { background: #4a9eff; }
    .toggle input:checked + .toggle-slider::before { transform: translateX(20px); background: #fff; }
    .radio-group { display: flex; gap: 16px; margin-top: 6px; }
    .radio-option { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .radio-option input[type="radio"] { accent-color: #4a9eff; width: 16px; height: 16px; cursor: pointer; }
    .radio-option span { font-size: 13px; color: #ccc; }
    .radio-hint { font-size: 11px; color: #666; margin-top: 4px; }
    .buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
    button {
      padding: 8px 20px; border-radius: 6px; border: 1px solid #3a3a3a;
      font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-cancel { background: #2a2a2a; color: #b0b0b0; }
    .btn-cancel:hover:not(:disabled) { background: #3a3a3a; color: #fff; }
    .btn-save { background: #4a9eff; border-color: #4a9eff; color: #fff; }
    .btn-save:hover:not(:disabled) { background: #3a8eef; }
    .status {
      font-size: 12px; margin-top: 12px; padding: 8px 12px; border-radius: 6px; display: none;
    }
    .status.checking {
      display: flex; align-items: center; gap: 8px;
      background: rgba(255, 255, 255, 0.05); border: 1px solid #333; color: #aaa;
    }
    .status.success {
      display: block; background: rgba(74, 200, 120, 0.1);
      border: 1px solid rgba(74, 200, 120, 0.3); color: #4ac878;
    }
    .status.error {
      display: block; background: rgba(255, 74, 74, 0.1);
      border: 1px solid rgba(255, 74, 74, 0.3); color: #ff4a4a;
    }
    .spinner {
      width: 14px; height: 14px; border: 2px solid #555; border-top-color: #aaa;
      border-radius: 50%; animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h2>Настройки прокси</h2>

  <div class="toggle-row">
    <div class="toggle">
      <input type="checkbox" id="proxyEnabled">
      <span class="toggle-slider" onclick="document.getElementById('proxyEnabled').click()"></span>
    </div>
    <label for="proxyEnabled">Включить прокси</label>
  </div>

  <div class="form-group">
    <label>Режим проксирования</label>
    <div class="radio-group">
      <label class="radio-option">
        <input type="radio" name="proxyMode" value="site_only" checked>
        <span>Только сайт</span>
      </label>
      <label class="radio-option">
        <input type="radio" name="proxyMode" value="all">
        <span>Весь трафик</span>
      </label>
    </div>
    <div class="radio-hint">«Только сайт» — видеоплееры работают напрямую (рекомендуется)</div>
  </div>

  <div id="status" class="status"></div>

  <div class="buttons">
    <button class="btn-cancel" id="btnCancel">Отмена</button>
    <button class="btn-save" id="btnSave">Сохранить</button>
  </div>

  <script>
    const proxyEnabled = document.getElementById('proxyEnabled');
    const statusEl = document.getElementById('status');
    const btnSave = document.getElementById('btnSave');
    const btnCancel = document.getElementById('btnCancel');

    window.electronAPI.getProxySettings().then(settings => {
      if (settings) {
        proxyEnabled.checked = settings.enabled || false;
        if (settings.mode) {
          const radio = document.querySelector(`input[name="proxyMode"][value="${settings.mode}"]`);
          if (radio) radio.checked = true;
        }
      }
    });

    function setLoading(loading) {
      btnSave.disabled = loading;
      btnCancel.disabled = loading;
      if (loading) {
        statusEl.className = 'status checking';
        statusEl.innerHTML = '<div class="spinner"></div> Проверка подключения к прокси...';
      }
    }

    btnSave.addEventListener('click', async () => {
      const mode = document.querySelector('input[name="proxyMode"]:checked')?.value || 'site_only';
      const settings = { enabled: proxyEnabled.checked, mode };

      if (settings.enabled) {
        setLoading(true);
      }

      try {
        const result = await window.electronAPI.saveProxySettings(settings);

        if (result.success) {
          statusEl.className = 'status success';
          statusEl.textContent = settings.enabled ? 'Прокси включен и работает' : 'Прокси отключен';
          setTimeout(() => window.electronAPI.closeProxyWindow(), 1000);
        } else {
          statusEl.className = 'status error';
          statusEl.textContent = 'Прокси недоступен: ' + (result.error || 'нет подключения');
          proxyEnabled.checked = false;
          btnSave.disabled = false;
          btnCancel.disabled = false;
        }
      } catch (e) {
        statusEl.className = 'status error';
        statusEl.textContent = 'Ошибка: ' + (e.message || 'неизвестная ошибка');
        btnSave.disabled = false;
        btnCancel.disabled = false;
      }
    });

    btnCancel.addEventListener('click', () => {
      window.electronAPI.closeProxyWindow();
    });
  </script>
</body>
</html>
